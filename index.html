<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Risk Survey Challenge</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" type="text/css" href="static/css/style.css">

    <link rel="icon" type="image/x-icon" href="static/img/icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Risk Survey Challenge">
    <link rel="apple-touch-icon" href="static/img/icon.png">
    
    <meta name="theme-color" content="#B5B9C4">
</head>

<body>
    <section id="view_start">
        <img src="static/img/icon.png">
        <h1>Risk Survey Challenge</h1>
        <button id="view_start_button"><p>START</p></button>
    </section>
    <section id="view_instructions" class="hidden"></section>
    <section id="view_camera_permission" class="hidden"></section>
    <section id="view_countdown" class="hidden">
        <h1 id="view_countdown_value">3</h1>
    </section>
    <section id="view_game" class="hidden">
        <div id="view_game_discover">
            <video id="view_game_discover_camera" muted autoplay></video>
            <div id="view_game_discover_capture" class="view_game_discover_capture">
                <p id="view_game_discover_capture_subtitle">SEARCHING</p>
                <h1 id="view_game_discover_capture_title">...</h1>
                <button id="view_game_discover_capture_button" class="view_game_drawer_toolbar_button">
                    <img id="view_game_discover_capture_button_icon" draggable="false" src="static/img/cube.svg">
                </button>
                <p>CAPTURE</p>
            </div>
        </div>
        <div id="view_game_drawer">
            <button id="view_game_drawer_toolbar_button_log" class="view_game_drawer_toolbar_button">
                <img id="view_game_drawer_toolbar_button_log_icon" draggable="false"
                    class="view_game_drawer_toolbar_button_icon" src="static/img/clipboard.svg">
                <h1>COLLECTION LOG</h1>
            </button>
            <div id="view_game_drawer_log">
                <div id="view_game_drawer_log_gallery"></div>
            </div>
            <div id="view_game_drawer_toolbar">
                <button id="view_game_drawer_toolbar_button_score" class="view_game_drawer_toolbar_button">
                    <img id="view_game_drawer_toolbar_button_score_icon" draggable="false"
                        class="view_game_drawer_toolbar_button_icon" src="static/img/star.svg">
                    <h1 id="view_game_drawer_toolbar_score_text">-</h1>
                </button>
                <!-- <button id="view_game_drawer_toolbar_button_timer" class="view_game_drawer_toolbar_button">
                    <img id="view_game_drawer_toolbar_button_timer_icon" draggable="false"
                        class="view_game_drawer_toolbar_button_icon" src="static/img/stopwatch.svg">
                    <h1 id="view_game_drawer_toolbar_timer_text">15m 8s</h1>
                </button> -->
            </div>
        </div>
    </section>
</body>

</html>

<script src="static/js/main.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
