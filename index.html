<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="theme-color" content="#75013f">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <link rel="stylesheet" type="text/css" href="static/css/style.css">
    </head>

    <body>
        <div class="views">
            <div id="view_start" class="view view_start">
                <div class="modal center-screen">
                    <img id="view_start_logo" class="logo" src="static/img/stag.gif?ignore=1">
                    <h1>Risk Survey Challenge</h1>
                    <p id="view_start_tagline">Locate safety technology in the real world using your camera.</p>
                    <button id="view_start_button">START</button>
                </div>
            </div>
            <div id="view_loading" class="view view_loading hidden">
                <div class="modal center-screen">
                    <h1>Instructions</h1>
                    <p>Use your camera to find safety technology in the real world.<br><br>Find as many as you can in 30 sec!</p>
                    <button id="view_loading_button">Next</button>
                </div>
            </div>
            <div id="view_countdown" class="view view_countdown hidden">
                <div class="modal center-screen">
                    <h1 id="view_countdown_value">3</h1>
                </div>
            </div>
            <div id="view_game" class="view view_game hidden">
                <div id="view_game_toolbar" class="view_game_toolbar_top">
                    <p id="view_game_item_status" class="item">SEARCHING</p>
                    <h1 id="view_game_item" class="item">...</h1>
                </div>
                <video id="view_game_video" muted autoplay></video>
                <div id="view_game_toolbar_bottom" class="modal screen-bottom">
                    <div>
                        <h1 id="view_game_timer">30</h1>
                        <p>TIMER</p>
                    </div>
                    <div>
                        <h1 id="view_game_score">0</h1>
                        <p>SCORE</p>
                    </div>
                </div>
            </div>
            <div id="view_finish" class="view view_finish hidden">
                <div class="modal center-screen">
                    <h1>Result</h1>
                    <p id="view_finish_message">You found 0 types of safety equipment.</p>
                    <div id="view_finish_gallery" class="grid-container"></div>
                    <button id="view_finish_button">TRY AGAIN?</button>
                </div>
            </div>
        </div>
    </body>

</html>

<script src="static/js/main.js" type="module"></script>
